<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<meta name="theme-color" content="#fcd3f0"/>
<title>🏠 우리가족 마음 저장소</title>
<meta property="og:title" content="🏠 우리가족 마음 저장소"/>
<meta property="og:description" content="가족이 서로에게 편지를 쓰고 추억을 아카이빙하는 공간이에요 💌"/>
<meta property="og:image" content="https://dokyeong-kim.github.io/family-letter-board/og-image.png"/>
<meta property="og:url" content="https://dokyeong-kim.github.io/family-letter-board/"/>
<meta property="og:type" content="website"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="🏠 우리가족 마음 저장소"/>
<meta name="twitter:description" content="가족이 서로에게 편지를 쓰고 추억을 아카이빙하는 공간이에요 💌"/>
<meta name="twitter:image" content="https://dokyeong-kim.github.io/family-letter-board/og-image.png"/>
<link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  /* ── 도트 편지 테마 ── */
  :root {
    --ink:#2a22d8; --ink-deep:#1b16a6; --ink-soft:rgba(42,34,216,.16);
    --pink:#ff6fce; --pink-2:#f443b3; --pink-soft:#fcc4ea;
    --yellow:#fff7b0; --cream:#fffbe3; --err:#e0247a;
    --px:'Galmuri11','Galmuri9',monospace;
    --black:'Pirata One',serif;
    --shell:560px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  input,textarea { font:inherit; color:inherit; }
  svg { display:block; }
  body {
    font-family:var(--px); color:var(--ink); min-height:100vh; overflow-x:hidden;
    background:#ebe6ff;
    background-image:radial-gradient(rgba(42,34,216,.13) 1px,transparent 1.2px);
    background-size:8px 8px;
    -webkit-font-smoothing:none; -webkit-tap-highlight-color:transparent;
  }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  :focus-visible { outline:2px dashed var(--pink-2); outline-offset:3px; }

  /* ── 화면 셸 ── */
  .screen {
    display:none; position:relative; max-width:var(--shell); margin:0 auto; min-height:100vh;
    overflow-x:clip;
    background:linear-gradient(180deg,#fcd3f0 0%,#fdeaf8 18%,#fefaff 48%,#fdfbe8 80%,#fcf7c4 100%);
  }
  .screen.active { display:block; animation:screenIn .3s steps(4); }
  @keyframes screenIn { from{transform:translateY(12px)} to{transform:none} }
  @media (min-width:600px) {
    .screen { box-shadow:0 0 0 2px var(--ink),0 24px 60px rgba(42,34,216,.22); }
  }

  /* ── 탑바 ── */
  .topbar {
    position:sticky; top:0; z-index:30;
    display:grid; grid-template-columns:64px 1fr 64px; align-items:center;
    height:66px; padding:0 8px;
    background:rgba(252,211,240,.96); backdrop-filter:blur(6px);
  }
  .topbar-title { text-align:center; font-size:20px; font-weight:400; letter-spacing:.02em; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icon-btn { width:48px; height:48px; display:grid; place-items:center; position:relative; justify-self:center; }
  .icon-btn svg { width:30px; height:30px; }
  .icon-btn.menu svg { width:34px; height:30px; }
  .icon-btn.back svg { width:16px; height:30px; }
  .count-badge {
    position:absolute; right:-2px; bottom:4px; min-width:24px; height:24px; padding:0 5px;
    border-radius:12px; background:var(--ink); color:#fff; border:2px solid #fff;
    font-size:12px; display:grid; place-items:center; line-height:1;
  }

  /* ── 공용 조각 ── */
  .page-heading { font-size:26px; line-height:1.5; font-weight:400; word-break:keep-all; }
  .section-label { display:block; font-size:15px; margin:28px 0 12px; }
  .pill {
    display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
    background:var(--yellow); border:1.5px solid var(--ink); border-radius:999px;
    padding:6px 12px; font-size:13px; line-height:1;
  }
  .pill svg { width:12px; height:12px; }
  .tag { flex-shrink:0; border:1.5px solid var(--ink); background:#fff; padding:7px 9px; font-size:14px; line-height:1; white-space:nowrap; }
  .from-label { font-family:var(--black); font-size:28px; line-height:1; letter-spacing:.02em; }
  .big-btn {
    display:block; width:100%; height:62px; border-radius:14px;
    background:var(--pink-soft); color:#fff; font-size:20px; letter-spacing:.06em;
    transition:background .15s;
  }
  .big-btn.ready { background:linear-gradient(180deg,#ff86d6,#f64ab7); box-shadow:inset 0 -3px 0 rgba(150,0,100,.22); }
  .big-btn:disabled { opacity:.6; cursor:wait; }
  .pink-btn {
    display:inline-block; padding:13px 26px; border-radius:12px;
    background:linear-gradient(180deg,#ff86d6,#f64ab7); color:#fff; font-size:18px;
    box-shadow:inset 0 -3px 0 rgba(150,0,100,.22);
  }

  /* 편지지 색 (저장값은 기존 hex 그대로) */
  [data-tone=pink]     { background:linear-gradient(165deg,#fdc0ec 0%,#fcdff5 42%,#fff 100%); }
  [data-tone=blue]     { background:linear-gradient(165deg,#c5ccfd 0%,#e4e7ff 45%,#fff 100%); }
  [data-tone=yellow]   { background:linear-gradient(165deg,#fff09c 0%,#fffad6 45%,#fff 100%); }
  [data-tone=mint]     { background:linear-gradient(165deg,#adf2e8 0%,#dcebff 50%,#fff 100%); }
  [data-tone=lavender] { background:linear-gradient(165deg,#d6c3ff 0%,#eee4ff 45%,#fff 100%); }
  [data-tone=cream]    { background:linear-gradient(180deg,#fff6c6 0%,#fffdf0 100%); }

  /* ── 우표 ── */
  .stamp-wrap { flex-shrink:0; filter:drop-shadow(0 2px 3px rgba(42,34,216,.22)); }
  .stamp {
    position:relative; width:80px; height:104px; padding:6px; background:#fff;
    -webkit-mask:linear-gradient(#000 0 0) content-box,radial-gradient(circle at center,#0000 2.4px,#000 2.7px) -4px -4px/8px 8px;
            mask:linear-gradient(#000 0 0) content-box,radial-gradient(circle at center,#0000 2.4px,#000 2.7px) -4px -4px/8px 8px;
  }
  .stamp svg,.stamp canvas { position:absolute; inset:6px; width:calc(100% - 12px); height:calc(100% - 12px); image-rendering:pixelated; }

  /* ══ 로그인 ══ */
  .login-wrap { position:relative; min-height:100vh; padding:28px 20px 120px; }
  .login-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; }
  .login-top .home svg { width:30px; height:30px; }
  .profile-grid { display:flex; flex-wrap:wrap; gap:10px; }
  .profile-card {
    display:flex; align-items:center; gap:10px;
    border:2px solid var(--ink); background:#fff !important;
    padding:8px 18px 8px 8px; font-size:18px; transition:transform .1s;
  }
  .profile-card:hover { background:var(--yellow) !important; transform:translateY(-2px); }
  .profile-avatar-lg,.login-selected-avatar {
    width:38px; height:38px; border:1.5px solid var(--ink);
    display:grid; place-items:center; font-size:16px; color:var(--ink);
  }
  .login-selected-profile {
    display:flex; align-items:center; gap:12px; margin:30px 0 4px;
    border:2px solid var(--ink); background:#fff; padding:10px 12px;
  }
  .login-selected-name { flex:1; font-size:20px; }
  .login-input {
    width:100%; height:66px; border:2px solid var(--ink); background:#fff; outline:0;
    text-align:center; font-size:30px; letter-spacing:.7em; padding-left:.7em; color:var(--ink);
  }
  .login-input::placeholder { color:rgba(42,34,216,.25); }
  .login-input:focus { box-shadow:4px 4px 0 var(--pink-soft); }
  .login-btn { position:absolute; left:20px; right:20px; bottom:28px; width:auto; }
  .login-error { margin-top:16px; min-height:20px; font-size:14px; line-height:1.5; }

  /* ══ 게시판 ══ */
  .board-hello { display:flex; flex-wrap:wrap; gap:8px; padding:0 20px; }
  .deck { position:relative; padding:26px 0 230px; }
  .letter-card {
    position:relative; width:88%; margin:-20px auto 0;
    padding:22px 20px 18px; border:2px solid var(--ink); border-radius:16px;
    cursor:pointer; box-shadow:0 8px 20px rgba(42,34,216,.12);
    transform:translateX(var(--x)) rotate(var(--r));
    transition:transform .2s steps(3);
  }
  .letter-card:first-child { margin-top:0; }
  .letter-card:hover,.letter-card:focus-visible { transform:translateX(var(--x)) rotate(var(--r)) translateY(-10px); }
  .card-head { display:flex; justify-content:space-between; gap:12px; }
  .card-text { min-width:0; flex:1; }
  .card-title {
    font-size:19px; line-height:1.55; word-break:keep-all; overflow-wrap:anywhere;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-text .from-label { margin-top:16px; }
  .from-name { font-size:17px; margin:10px 0 0 16px; }
  .from-sub { font-size:15px; margin:7px 0 0 16px; }
  .tags { display:flex; gap:6px; margin-top:16px; overflow:hidden; }

  /* 빈 상태 · 로딩 */
  .empty { display:flex; flex-direction:column; align-items:center; text-align:center; padding:26vh 20px 0; }
  .bubble svg { width:78px; height:auto; }
  .bar { width:190px; height:16px; margin:16px 0 34px; border:2px solid var(--ink); border-radius:9px; background:#fff; position:relative; overflow:hidden; }
  .bar::after { content:''; position:absolute; inset:2px; border-radius:5px; background:var(--ink); }
  .empty p { font-size:18px; line-height:1.9; margin-bottom:24px; }
  #board-loading {
    display:none; position:fixed; inset:0; z-index:90;
    flex-direction:column; align-items:center; justify-content:center;
    background:rgba(253,238,250,.88);
  }
  #board-loading .bar::after { transform-origin:left; animation:fill 1.2s steps(8) infinite; }
  #board-loading p { font-size:16px; }
  @keyframes fill { from{transform:scaleX(0)} to{transform:scaleX(1)} }

  /* 뜯어서 열기 */
  .open-overlay { display:none; position:fixed; inset:0; z-index:80; background:rgba(55,42,222,.84); touch-action:none; user-select:none; }
  .open-overlay.show { display:block; animation:fadeIn .2s steps(3); }
  @keyframes fadeIn { from{background:rgba(55,42,222,0)} }
  .open-inner { position:relative; max-width:var(--shell); height:100%; margin:0 auto; }
  .open-hint { position:absolute; left:0; right:0; top:34%; display:flex; flex-direction:column; align-items:center; gap:22px; color:#fff; font-size:26px; pointer-events:none; }
  .open-arrow { position:relative; width:240px; height:2px; background:#fff; }
  .open-arrow svg { position:absolute; right:-2px; top:-8px; width:10px; height:18px; color:#fff; }
  .envelope { position:absolute; left:22px; right:22px; bottom:-24px; cursor:grab; animation:envUp .35s steps(6); }
  @keyframes envUp { from{transform:translateY(60%)} to{transform:none} }
  .env-flap { height:30px; border-radius:16px 16px 0 0; border-bottom:2px dashed var(--ink); background:#fff6c6; transition:transform .05s; }
  .env-body { padding:18px 20px 60px; }
  .env-body .card-title { -webkit-line-clamp:3; }
  .envelope.torn .env-flap { transition:transform .35s steps(5); transform:translate(115%,-60px) rotate(14deg) !important; }
  .envelope.torn .env-body { transition:transform .45s steps(6) .15s; transform:translateY(-40vh); }

  /* ══ 편지 작성 ══ */
  .write-wrap,.detail-wrap,.settings-wrap { padding:10px 20px 190px; }
  .color-swatches { display:flex; gap:12px; flex-wrap:wrap; }
  .swatch { position:relative; width:46px; height:46px; border:2px solid var(--ink); border-radius:10px; cursor:pointer; }
  .swatch.active::after { content:''; position:absolute; inset:-7px; border:2px solid var(--ink); border-radius:14px; }
  .font-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .font-btn { border:2px solid var(--ink); background:#fff; padding:10px 16px; font-size:17px; line-height:1.1; }
  .font-btn.active { background:var(--ink); color:#fff; }
  .write-paper,.detail-paper { position:relative; margin-top:26px; padding:0 20px 22px; border:2px solid var(--ink); border-radius:16px; }
  .paper-tear { height:26px; margin:0 -20px 18px; border-bottom:2px dashed var(--ink); }
  .auto-date { margin-bottom:10px; }
  .field-row { display:flex; align-items:baseline; gap:10px; padding:8px 0; border-bottom:2px solid var(--ink); margin-bottom:10px; }
  .field-label { font-family:var(--black); font-size:26px; flex-shrink:0; }
  .field-input { flex:1; min-width:0; border:0; outline:0; background:transparent; font-size:21px; color:var(--ink); }
  .field-input::placeholder,.content-area::placeholder { color:rgba(42,34,216,.35); }
  .field-input[readonly] { cursor:default; }
  .content-area {
    display:block; width:100%; min-height:266px; margin:8px 0 14px; padding:0 2px;
    border:0; outline:0; resize:vertical; color:var(--ink); font-size:20px; line-height:38px;
    background:repeating-linear-gradient(transparent 0 37px,rgba(42,34,216,.28) 37px 38px);
  }
  .photo-upload-area { display:flex; gap:14px; flex-wrap:wrap; }
  .photo-slot {
    position:relative; width:80px; height:104px; border:2px dashed var(--ink); background:rgba(255,255,255,.75);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    font-size:12px; cursor:pointer;
  }
  .photo-slot svg { width:16px; height:16px; }
  .photo-slot:hover { background:var(--yellow); }
  .photo-slot.filled { border:5px solid #fff; background:#fff; cursor:default; box-shadow:0 2px 6px rgba(42,34,216,.25); }
  .photo-slot.filled img { width:100%; height:100%; object-fit:cover; }
  .slot-del { position:absolute; top:-12px; right:-12px; width:26px; height:26px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; }
  .slot-del svg { width:10px; height:10px; }
  .btn-row { display:flex; gap:10px; margin-top:24px; }
  .btn-cancel { height:62px; padding:0 24px; border:2px solid var(--ink); border-radius:14px; background:#fff; font-size:18px; }
  .btn-send { flex:1; }

  /* ══ 편지 상세 ══ */
  .detail-actions { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .detail-edit-btn { font-size:14px; padding:8px 14px; }
  .detail-head { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }
  .detail-to { font-size:22px; line-height:1.5; word-break:keep-all; padding-top:4px; }
  .detail-to::before { content:'「'; } .detail-to::after { content:'」'; }
  .detail-body { margin:24px 0; font-size:21px; line-height:2; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--ink-deep); }
  .detail-photos { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
  .detail-photos img { width:120px; height:150px; object-fit:cover; border:6px solid #fff; box-shadow:0 3px 8px rgba(42,34,216,.25); }
  .detail-photos img:nth-child(odd) { transform:rotate(-2deg); } .detail-photos img:nth-child(even) { transform:rotate(2deg); }
  .detail-sign { text-align:right; }
  /* 손글씨체는 도트체보다 작아 보여서 키움 */
  .detail-body[style*="Nanum Pen"],.content-area[style*="Nanum Pen"] { font-size:27px; }
  .detail-from[style*="Nanum Pen"],.field-input[style*="Nanum Pen"] { font-size:26px; }
  .detail-body[style*="Gaegu"],.content-area[style*="Gaegu"],.detail-from[style*="Gaegu"],.field-input[style*="Gaegu"] { font-size:23px; }
  .detail-from { font-size:21px; margin-top:10px; }

  .comment-section { margin-top:28px; border:2px solid var(--ink); border-radius:16px; background:rgba(255,255,255,.8); padding:18px 16px; }
  .comment-section-title { display:flex; align-items:center; gap:8px; font-size:17px; margin-bottom:16px; }
  .comment-section-title svg { width:20px; height:18px; }
  .comment-list { display:flex; flex-direction:column; gap:12px; }
  .comment-item { display:flex; gap:10px; align-items:flex-start; }
  .comment-avatar { width:36px; height:36px; flex-shrink:0; border:1.5px solid var(--ink); display:grid; place-items:center; font-size:15px; color:var(--ink) !important; }
  .comment-bubble { flex:1; min-width:0; border:1.5px solid var(--ink); background:#fff; padding:10px 12px; }
  .comment-name { font-size:13px; opacity:.7; }
  .comment-text { font-size:15px; line-height:1.65; margin:4px 0; overflow-wrap:anywhere; }
  .comment-time { font-size:11px; opacity:.5; }
  .comment-input-row { display:flex; gap:8px; margin-top:16px; }
  .comment-input { flex:1; min-width:0; height:48px; border:2px solid var(--ink); background:#fff; padding:0 12px; font-size:15px; outline:0; }
  .comment-input::placeholder { color:rgba(42,34,216,.35); }
  .comment-submit { height:48px; padding:0 16px; border-radius:10px; background:linear-gradient(180deg,#ff86d6,#f64ab7); color:#fff; font-size:15px; white-space:nowrap; }

  /* ══ 설정 ══ */
  .settings-profile { text-align:center; margin:6px 0 26px; }
  .settings-avatar { width:84px; height:84px; margin:0 auto 14px; border:2px solid var(--ink); display:grid; place-items:center; font-size:34px; color:var(--ink) !important; }
  .settings-name-display { font-size:22px; margin-bottom:10px; }
  .settings-section { border:2px solid var(--ink); border-radius:16px; background:rgba(255,255,255,.82); margin-bottom:16px; overflow:hidden; }
  .settings-section-title { padding:12px 16px; font-size:14px; border-bottom:2px dashed var(--ink); background:rgba(252,196,234,.35); }
  .settings-row { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1.5px solid var(--ink-soft); }
  .settings-row:last-child { border-bottom:0; }
  .settings-row-label { font-size:15px; flex-shrink:0; }
  .settings-row-value { flex:1; text-align:right; font-size:15px; opacity:.7; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .settings-edit-form { display:none; padding:14px 16px; border-bottom:1.5px solid var(--ink-soft); background:rgba(255,247,176,.35); }
  .settings-edit-form.open { display:block; }
  .settings-edit-form label { display:block; font-size:13px; margin-bottom:6px; }
  .settings-edit-input { width:100%; height:46px; border:2px solid var(--ink); background:#fff; padding:0 12px; font-size:17px; margin-bottom:12px; outline:0; color:var(--ink); }
  .settings-edit-input[type=password] { letter-spacing:.3em; }
  .settings-form-btns { display:flex; justify-content:flex-end; gap:8px; }
  .settings-save-btn { padding:10px 18px; border-radius:10px; background:linear-gradient(180deg,#ff86d6,#f64ab7); color:#fff; font-size:14px; }
  .settings-cancel-btn { padding:10px 16px; border:1.5px solid var(--ink); background:#fff; font-size:14px; }
  .settings-msg { min-height:18px; margin-bottom:6px; font-size:13px; text-align:right; }
  .settings-msg.ok { color:#0b8a5c; } .settings-msg.err { color:var(--err); }
  .settings-danger-btn { width:100%; display:flex; align-items:center; gap:8px; padding:16px; font-size:15px; color:var(--err); text-align:left; }
  .member-avatar { width:34px; height:34px; flex-shrink:0; border:1.5px solid var(--ink); display:grid; place-items:center; font-size:15px; }
  .member-name { flex:1; font-size:16px; }

  /* ══ 하단 탭 · 플로팅 버튼 ══ */
  .dock { position:fixed; left:0; right:0; bottom:0; z-index:40; max-width:var(--shell); margin:0 auto; pointer-events:none; }
  body[data-screen=login] .dock { display:none; }
  .fabs { position:absolute; right:16px; bottom:92px; width:124px; height:132px; }
  body:not([data-screen=board]) .fabs { display:none; }
  .fab { position:absolute; width:76px; height:76px; border-radius:50%; border:2px solid var(--ink); display:grid; place-items:center; pointer-events:auto; transition:transform .1s; }
  .fab:active { transform:scale(.94); }
  .fab svg { width:34px; height:34px; }
  .fab-refresh { left:0; top:0; background:var(--ink); color:#fff; }
  .fab-write { right:0; bottom:0; background:var(--yellow); color:var(--ink); }
  .tabbar {
    display:flex; align-items:flex-end; gap:0; padding:12px 18px 0; pointer-events:auto;
    border-bottom:calc(10px + env(safe-area-inset-bottom)) solid var(--ink);
    background:linear-gradient(180deg,rgba(252,247,196,0),rgba(252,247,196,.95) 45%);
  }
  .tab { flex:1; height:56px; border:2px solid var(--ink); border-bottom:0; border-radius:14px 14px 0 0; background:#fff; font-size:19px; }
  .tab.active { height:66px; background:var(--ink); color:#fff; }

  @media (max-width:420px) {
    .topbar-title { font-size:17px; }
    .page-heading { font-size:23px; }
    .letter-card { width:90%; padding:18px 16px 16px; }
    .card-title { font-size:17px; }
    .stamp { width:72px; height:96px; }

      rects += '<rect x="' + x + '" y="' + y + '" width="' + (e - x) + '" height="1" fill="' + (pal[c] || 'currentColor') + '"/>';

function pixelatePhotos(root) {
  root.querySelectorAll('canvas.stamp-photo').forEach(cv => {
    const img = new Image();
    img.onload = () => {
      const ctx = cv.getContext('2d');
      const r = Math.max(cv.width / img.width, cv.height / img.height);
      const w = img.width * r, h = img.height * r;
      ctx.drawImage(img, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
    };
    img.onerror = () => cv.remove();
    img.src = cv.dataset.src;
  });
}

// ── 게시판
async function loadBoard() {
  showLoading(true);
  try {
    const q = query(collection(db, 'letters'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    lettersCache = [];
    snap.forEach(d => lettersCache.push({ id: d.id, data: d.data() }));
    renderBoard();
  } catch(e) { console.error(e); }
  showLoading(false);
}

function letterTitle(body) {
  const first = String(body || '').split('\n').map(s => s.trim()).find(Boolean) || '';
  return '「' + first + '」';
}
function cardInner(item) {
  const l = item.data;
  const photos = l.photos || [];
  const tags = ['To. ' + (l.to || ''), '댓글 ' + (l.commentCount || 0)];
  if (photos.length) tags.push('사진 ' + photos.length);
  return '<div class="card-head"><div class="card-text">'
    + '<p class="card-title">' + escapeHtml(letterTitle(l.body)) + '</p>'
    + '<p class="from-label">From.</p>'
    + '<p class="from-name">' + escapeHtml(l.from) + ',</p>'
    + '<p class="from-sub">' + escapeHtml(l.date) + '</p>'
    + '</div>' + stampHtml(item.id, photos[0]) + '</div>'
    + '<div class="tags">' + tags.map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join('') + '</div>';
}

function renderBoard() {
  const grid = document.getElementById('board-grid');
  document.getElementById('letter-count').textContent = lettersCache.length;
  if (!lettersCache.length) {
    grid.innerHTML = '<div class="empty"><span class="bubble">' + icon('bubble') + '</span><div class="bar"></div>'
      + '<p>아직 주고받은 편지가 없어요!<br>첫 편지를 써볼까요?</p>'
      + '<button id="new-card-btn" class="pink-btn" type="button">편지 쓰러 가기</button></div>';
  } else {
    const rot = [-3.5, 3, -2, 4, -3, 2.5];
    const shift = [-5, 7, -8, 5, -3, 8];
    grid.innerHTML = lettersCache.map((item, idx) =>
      '<article class="letter-card" tabindex="0" role="button" data-tone="' + toneOf(item.data.bg) + '" data-lid="' + escapeHtml(item.id) + '"'
      + ' style="--r:' + rot[idx % 6] + 'deg;--x:' + shift[idx % 6] + '%;z-index:' + (idx + 1) + ';">'
      + cardInner(item) + '</article>'
    ).join('');
  }
  grid.querySelectorAll('.letter-card').forEach(c => {
    c.addEventListener('click', () => openEnvelope(c.dataset.lid));
    c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(c.dataset.lid); } });
  });
  pixelatePhotos(grid);
  const nb = document.getElementById('new-card-btn');
  if (nb) nb.addEventListener('click', goWrite);
}

function showLoading(show) {
  const el = document.getElementById('board-loading');
  if (el) el.style.display = show ? 'flex' : 'none';
}

// ── 뜯어서 편지 열어보기
let envLid = null, envDrag = null;
function openEnvelope(lid) {
  const item = lettersCache.find(x => x.id === lid);
  if (!item) return goDetail(lid);
  envLid = lid;
  const body = document.getElementById('envelope-body');
  body.innerHTML = cardInner(item);
  pixelatePhotos(body);
  const env = document.getElementById('envelope');
  env.classList.remove('torn');
  document.getElementById('env-flap').style.transform = '';
  env.style.animation = 'none'; env.offsetHeight; env.style.animation = '';
  document.getElementById('open-overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeEnvelope() {
  document.getElementById('open-overlay').classList.remove('show');
  document.body.style.overflow = '';
  envDrag = null;
}
function tearEnvelope() {
  const env = document.getElementById('envelope');
  if (env.classList.contains('torn')) return;
  env.classList.add('torn');
  const lid = envLid;
  setTimeout(async () => { await goDetail(lid); closeEnvelope(); }, 620);
}
function bindEnvelope() {
  const ov = document.getElementById('open-overlay');
  const flap = document.getElementById('env-flap');
  ov.addEventListener('pointerdown', e => {
    envDrag = { x: e.clientX, dx: 0, onEnvelope: !!e.target.closest('.envelope') };
    ov.setPointerCapture(e.pointerId);
  });
  ov.addEventListener('pointermove', e => {
    if (!envDrag) return;
    envDrag.dx = Math.max(0, e.clientX - envDrag.x);
    flap.style.transform = 'translate(' + envDrag.dx + 'px,' + (-envDrag.dx * .08) + 'px) rotate(' + (envDrag.dx * .04) + 'deg)';
  });
  ov.addEventListener('pointerup', () => {
    if (!envDrag) return;
    const { dx, onEnvelope } = envDrag; envDrag = null;
    if (dx > 90 || (dx < 6 && onEnvelope)) tearEnvelope();
    else if (dx < 6) closeEnvelope();
    else flap.style.transform = '';
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ov.classList.contains('show')) closeEnvelope(); });
}

  list.innerHTML = comments.map(c => {
    const ac = AVATAR_COLORS[c.name] || { bg:'#ffd1dc', color:'#880e4f' };

      + '<div class="comment-bubble"><p class="comment-name">' + escapeHtml(c.name) + '</p><p class="comment-text">' + escapeHtml(c.text) + '</p><p class="comment-time">' + escapeHtml(c.time) + '</p></div></div>';
  }).join('');

let commentPending = false;
async function submitComment() {
  const input = document.getElementById('detail-comment-input');
  const val = input.value.trim();
  if (!val || !currentLetterId || commentPending) return;
  commentPending = true;
  try {
    const now = new Date();
    const t = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0');
    await addDoc(collection(db,'letters',currentLetterId,'comments'), { authorUid:auth.currentUser.uid, name:currentUser, text:val, time:t, createdAt:serverTimestamp() });
    const lr = doc(db,'letters',currentLetterId);
    const ls = await getDoc(lr);
    if (ls.exists()) await updateDoc(lr, { commentCount:(ls.data().commentCount||0)+1 });
    input.value = '';
    await loadComments(currentLetterId);
    // 게시판 캐시 업데이트
    const ci = lettersCache.findIndex(x => x.id === currentLetterId);
    if (ci >= 0) { lettersCache[ci].data.commentCount = (lettersCache[ci].data.commentCount||0)+1; renderBoard(); }
  } finally { commentPending = false; }
}

function applyFont(font) {

function resetPhotoSlots() { document.querySelectorAll('.photo-slot').forEach((s,i)=>resetSlot(s,i)); }
function resetSlot(slot,i) {
  slot.classList.remove('filled');
  slot.innerHTML=icon('plus') + '<span>사진 추가</span>';
  slot.onclick = () => triggerUpload(i);
}

function setSlotWithDelete(slot, i, url) {
  slot.classList.add('filled');
  slot.onclick = null;
  slot.innerHTML = '<img src="' + escapeHtml(url) + '" alt="">'
    + '<button type="button" class="slot-del" aria-label="사진 삭제" onclick="event.stopPropagation();removePhoto(' + i + ')">' + icon('close') + '</button>';
}

let removedPhotoIndices = [];

function removePhoto(i) {
  pendingPhotoFiles[i] = null;
  if (isEditMode) removedPhotoIndices.push(i);
  const slots = document.querySelectorAll('.photo-slot');
  if (slots[i]) resetSlot(slots[i], i);
}
function triggerUpload(slot) { uploadSlot=slot; document.getElementById('file-input').click(); }
function handlePhoto(e) {
  const file=e.target.files[0]; if(!file) return;
  pendingPhotoFiles[uploadSlot]=file;
  const url=URL.createObjectURL(file);
  const slots=document.querySelectorAll('.photo-slot');
  setSlotWithDelete(slots[uploadSlot], uploadSlot, url);
  e.target.value='';
}
async function uploadPhotos(lid) {
  const urls=[];
  for(let i=0;i<3;i++){
    if(pendingPhotoFiles[i]){
      const sr=ref(storage,'letters/'+auth.currentUser.uid+'/'+lid+'/photo_'+i+'_'+Date.now());
      await uploadBytes(sr,pendingPhotoFiles[i]);
      urls.push(await getDownloadURL(sr));
    }
  }
  return urls;
}

async function submitLetter() {
  const to=document.getElementById('field-to').value.trim();
  const from=document.getElementById('field-from').value.trim();
  const body=document.getElementById('field-content').value.trim();
  if(!to||!from||!body){alert('편지 내용을 모두 작성해주세요!');return;}
  const now=new Date();
  const dateStr=now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0');
  const ac=AVATAR_COLORS[from]||{bg:'#fce4ec',color:'#880e4f'};
  const btn=document.getElementById('btn-send-write');
  btn.disabled=true;
  try{
    if(isEditMode&&currentLetterId){
      const newPhotos=await uploadPhotos(currentLetterId);
      const ls=await getDoc(doc(db,'letters',currentLetterId));
      let oldPhotos=ls.exists()?(ls.data().photos||[]):[];
      // 삭제된 사진 제거
      oldPhotos = oldPhotos.filter((_,idx) => !removedPhotoIndices.includes(idx));
      const merged=newPhotos.length>0?[...oldPhotos,...newPhotos].slice(0,3):oldPhotos;
      await updateDoc(doc(db,'letters',currentLetterId),{to,body,bg:currentBg,font:currentFont,textColor:ac.color,photos:merged,editedDate:dateStr});
      await loadBoard(); goDetail(currentLetterId);
    }else{
      const newRef=doc(collection(db,'letters'));
      const photos=await uploadPhotos(newRef.id);
      await setDoc(newRef,{ownerUid:auth.currentUser.uid,to,from:currentUser,body,bg:currentBg,font:currentFont,textColor:ac.color,date:dateStr,photos,commentCount:0,createdAt:serverTimestamp()});
      await loadBoard();
      alert('편지가 전달되었어요 💌');
      goBoard();
    }
  }catch(e){console.error(e);alert('저장 중 오류가 발생했어요.');}
  finally{btn.disabled=false;}
}

let loginPending = false;
function showLoginError(error) {
  console.error(error.code || 'login-failed');
  const code = String(error.code || '').split('/').pop();
  const messages = {
    'unauthenticated':'비밀번호가 틀렸어요. 다시 확인해 주세요.',
    'resource-exhausted':'입력 횟수가 너무 많아요. 잠시 후 다시 시도해 주세요. 반복되면 최대 24시간 기다려 주세요.',
    'permission-denied':'접근 권한을 확인하지 못했어요. 다시 로그인해 주세요.',
    'invalid-argument':'비밀번호는 숫자 4자리로 입력해 주세요.'
  };
  document.getElementById('login-error').textContent = messages[code] || '서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.';
}
async function tryLogin() {
  if(loginPending)return;
  const name=selectedLoginUser;
  const pw=document.getElementById('login-pw').value.trim();
  const errEl=document.getElementById('login-error');
  if(!name){errEl.textContent='프로필을 선택해 주세요.';return;}
  if(!pw){errEl.textContent='비밀번호를 입력해 주세요.';return;}
  const button=document.getElementById('btn-enter');
  loginPending=true;
  button.disabled=true;
  button.textContent='확인 중…';
  errEl.textContent='';
  try {
  if(!/^[0-9]{4}$/.test(pw)) { errEl.textContent='비밀번호는 숫자 4자리로 입력해 주세요.'; return; }
  const result=await callServer('familyLogin',{memberId:name,pin:pw});
  await signInWithCustomToken(auth,result.token);
  await enterBoard(result.name);
  } catch(error) {
    showLoginError(error);
  } finally {
    loginPending=false;
    button.disabled=false;
    button.textContent='들어가기';
  }
}

async function savePassword() {
  const curPw=document.getElementById('cur-pw').value.trim();
  const newPw=document.getElementById('new-pw').value.trim();
  const newPw2=document.getElementById('new-pw2').value.trim();
  const msgEl=document.getElementById('password-msg');
  if(!curPw||!newPw||!newPw2){msgEl.className='settings-msg err';msgEl.textContent='모든 칸을 채워 주세요.';return;}
  if(!/^[0-9]{4}$/.test(newPw)){msgEl.className='settings-msg err';msgEl.textContent='새 비밀번호는 숫자 4자리로 입력해 주세요.';return;}
  if(newPw!==newPw2){msgEl.className='settings-msg err';msgEl.textContent='새 비밀번호가 일치하지 않아요.';return;}
  try {
    const result=await callServer('familyChangePin',{currentPin:curPw,newPin:newPw});
    await signInWithCustomToken(auth,result.token);
  } catch(error) {
    msgEl.className='settings-msg err';msgEl.textContent=error.message;return;
  }
  msgEl.className='settings-msg ok';msgEl.textContent='비밀번호가 변경되었어요!';
  ['cur-pw','new-pw','new-pw2'].forEach(id=>document.getElementById(id).value='');
  setTimeout(()=>{document.getElementById('password-form').classList.remove('open');msgEl.textContent='';},1200);
}

function toggleForm(formId) {
  const form=document.getElementById(formId);
  const isOpen=form.classList.contains('open');
  ['nickname-form','password-form'].forEach(id=>document.getElementById(id).classList.remove('open'));
  if(!isOpen)form.classList.add('open');
}

// ── 스와치/폰트
function setColor(el,bg) {
  currentBg=bg; applySwatch(bg);
}
function setFont(el,font) {
  document.querySelectorAll('.font-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active'); currentFont=font;
  ['field-to','field-from','field-content'].forEach(id=>{document.getElementById(id).style.fontFamily=font;});
}

// ── 로그인 이벤트
let loginEventsBound = false;
function bindLoginEvents() {
  if(loginEventsBound)return;
  loginEventsBound=true;
  var cb=document.getElementById('btn-change');
  if(cb)cb.addEventListener('click',function(){
    selectedLoginUser='';
    document.getElementById('login-step1').style.display='block';
    document.getElementById('login-step2').style.display='none';
    document.getElementById('login-pw').value='';
    document.getElementById('btn-enter').classList.remove('ready');
    document.getElementById('login-error').textContent='';
  });
  var eb=document.getElementById('btn-enter');
  if(eb)eb.addEventListener('click',tryLogin);
  var pi=document.getElementById('login-pw');
  if(pi){
    pi.addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
    pi.addEventListener('input',function(){eb.classList.toggle('ready',/^[0-9]{4}$/.test(pi.value));});
  }
}

// ── 초기화
function bindAllEvents() {
  paintIcons();

  // 편지 작성
  const cancelBtn = document.getElementById('btn-cancel-write');
  if (cancelBtn) cancelBtn.addEventListener('click', goWriteBack);
  const sendBtn = document.getElementById('btn-send-write');
  if (sendBtn) sendBtn.addEventListener('click', submitLetter);
  document.getElementById('write-back-btn').addEventListener('click', goWriteBack);

  // 사진 슬롯
  const slots = document.querySelectorAll('.photo-slot');
  slots.forEach((s, i) => resetSlot(s, i));
  const fileInput = document.getElementById('file-input');
  if (fileInput) fileInput.addEventListener('change', handlePhoto);

  // 색상 스와치
  document.querySelectorAll('.swatch').forEach(s => {
    s.addEventListener('click', () => setColor(s, s.dataset.bg));
  });

  // 폰트 버튼
  document.querySelectorAll('.font-btn').forEach(b => {
    b.addEventListener('click', () => setFont(b, b.dataset.font));
  });

  // 댓글
  const commentBtn = document.querySelector('.comment-submit');
  if (commentBtn) commentBtn.addEventListener('click', submitComment);
  const commentInput = document.getElementById('detail-comment-input');
  if (commentInput) commentInput.addEventListener('keydown', e => { if(e.key==='Enter' && !e.isComposing) submitComment(); });

  // 설정
  const nicknameToggle = document.getElementById('nickname-row')?.querySelector('.settings-edit-btn');
  if (nicknameToggle) nicknameToggle.addEventListener('click', () => toggleForm('nickname-form'));
  const pwToggle = document.getElementById('password-row')?.querySelector('.settings-edit-btn');
  if (pwToggle) pwToggle.addEventListener('click', () => toggleForm('password-form'));

  const saveNickBtn = document.querySelector('#nickname-form .settings-save-btn');
  if (saveNickBtn) saveNickBtn.addEventListener('click', saveNickname);
  const cancelNickBtn = document.querySelector('#nickname-form .settings-cancel-btn');
  if (cancelNickBtn) cancelNickBtn.addEventListener('click', () => toggleForm('nickname-form'));

  const savePwBtn = document.querySelector('#password-form .settings-save-btn');
  if (savePwBtn) savePwBtn.addEventListener('click', savePassword);
  const cancelPwBtn = document.querySelector('#password-form .settings-cancel-btn');
  if (cancelPwBtn) cancelPwBtn.addEventListener('click', () => toggleForm('password-form'));

  const nicknameInput = document.getElementById('new-nickname');
  if (nicknameInput) nicknameInput.addEventListener('keydown', e => { if(e.key==='Enter' && !e.isComposing) saveNickname(); });
  const newPw2Input = document.getElementById('new-pw2');
  if (newPw2Input) newPw2Input.addEventListener('keydown', e => { if(e.key==='Enter') savePassword(); });

  // 로그아웃
  document.querySelectorAll('.settings-danger-btn').forEach(b => b.addEventListener('click', doLogout));

  // 제목 누르면 게시판으로
  document.querySelectorAll('.logo').forEach(l => l.addEventListener('click', goBoard));

  // 메뉴 → 설정
  document.querySelectorAll('.logout-btn').forEach(b => b.addEventListener('click', goSettings));

  // 플로팅 버튼 · 하단 탭
  document.querySelector('.fab-write').addEventListener('click', goWrite);
  document.getElementById('btn-refresh').addEventListener('click', loadBoard);
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    if (t.dataset.tab === 'settings') { if (!document.getElementById('screen-settings').classList.contains('active')) goSettings(); }
    else goBoard();
  }));
  const observer = new MutationObserver(syncDock);
  document.querySelectorAll('.screen').forEach(s => observer.observe(s, { attributes:true, attributeFilter:['class'] }));
  syncDock();

  bindEnvelope();

  // 뒤로가기
  document.getElementById('detail-back-btn').addEventListener('click', goBoard);
  document.getElementById('settings-back-btn').addEventListener('click', goBack);
}

async function init() {
  // 함께한 날 계산 (2005.02.15 기준)
  const birth = new Date(2005, 1, 15);
  const today = new Date();
  const days = Math.floor((today - birth) / (1000 * 60 * 60 * 24));
  document.querySelectorAll('#days-count').forEach(el => {
    el.textContent = days.toLocaleString();
  });
  bindLoginEvents();
  bindAllEvents();
  try {
  sessionStorage.removeItem('currentUser');
  document.querySelector('.profile-grid').replaceChildren();
  document.getElementById('login-error').textContent='가족 정보를 불러오고 있어요…';
  await setPersistence(auth,browserSessionPersistence);
  await auth.authStateReady();
  await loadProfiles();
  document.getElementById('login-error').textContent='';
  if(auth.currentUser) {
    const member = await getDoc(doc(db,'members',auth.currentUser.uid));
    if(member.exists() && member.data().enabled)await enterBoard(member.data().name);
    else await signOut(auth);
  }
  } catch(error) {
    showLoginError(error);
  }
}

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}

// 전역 노출
window.goBoard=goBoard; window.goWrite=goWrite; window.goBack=goBack;
window.goDetail=goDetail; window.goSettings=goSettings; window.doLogout=doLogout;
window.submitLetter=submitLetter; window.submitComment=submitComment;
window.saveNickname=saveNickname; window.savePassword=savePassword;
window.toggleForm=toggleForm; window.setColor=setColor; window.setFont=setFont;
window.triggerUpload=triggerUpload; window.handlePhoto=handlePhoto;
window.goWriteBack=goWriteBack; window.removePhoto=removePhoto;

</script>
